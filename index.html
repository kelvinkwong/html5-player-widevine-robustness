<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRM Robustness Player</title>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.0/dist/shaka-player.compiled.js"></script>

  <style>
    body {
      font-family: sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 10px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; }

    button {
      margin-top: 15px;
      padding: 8px 16px;
      margin-right: 8px;
    }

    video {
      width: 100%;
      margin-top: 20px;
      background: #000;
    }

    #log {
      margin-top: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h1>DRM Robustness Check Player</h1>

  <label for="manifestUrl">MANIFEST_URL</label>
  <input id="manifestUrl" type="url"
         placeholder="https://example.com/manifest.mpd">

  <label for="licenseUrl">LICENSE_URL</label>
  <input id="licenseUrl" type="url"
         placeholder="https://example.com/widevine/license">

  <label for="keySystem">KEY_SYSTEM</label>
  <select id="keySystem">
    <option value="com.widevine.alpha">com.widevine.alpha</option>
    <option value="com.microsoft.playready">com.microsoft.playready</option>
  </select>

  <label for="videoRobustness">Video Robustness</label>
  <select id="videoRobustness"></select>

  <label for="audioRobustness">Audio Robustness</label>
  <select id="audioRobustness"></select>

  <div class="checkbox-row">
    <input id="autoload" type="checkbox">
    <label for="autoload">Autoload and autoplay</label>
  </div>

  <button id="loadBtn" type="button">Load</button>
  <button id="shareBtn" type="button">Share</button>

  <div id="shareArea" hidden>
    <label for="shareUrl">Shareable URL</label>
    <input id="shareUrl" type="text" readonly>
  </div>

  <video id="video" controls playsinline></video>
  <div id="log" role="status"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const WIDEVINE = 'com.widevine.alpha';
      const PLAYREADY = 'com.microsoft.playready';

      const manifestInput = document.getElementById('manifestUrl');
      const licenseInput = document.getElementById('licenseUrl');
      const keySystemSelect = document.getElementById('keySystem');
      const videoSelect = document.getElementById('videoRobustness');
      const audioSelect = document.getElementById('audioRobustness');
      const autoloadInput = document.getElementById('autoload');
      const loadButton = document.getElementById('loadBtn');
      const shareButton = document.getElementById('shareBtn');
      const shareArea = document.getElementById('shareArea');
      const shareInput = document.getElementById('shareUrl');
      const video = document.getElementById('video');
      const logEl = document.getElementById('log');

      let player;
      let loading = false;
      let supported = false;

      const robustnessOptions = {
        [WIDEVINE]: [
          ['', '(none)'],
          ['SW_SECURE_CRYPTO', 'SW_SECURE_CRYPTO'],
          ['SW_SECURE_DECODE', 'SW_SECURE_DECODE'],
          ['HW_SECURE_CRYPTO', 'HW_SECURE_CRYPTO'],
          ['HW_SECURE_DECODE', 'HW_SECURE_DECODE'],
          ['HW_SECURE_ALL', 'HW_SECURE_ALL']
        ],
        [PLAYREADY]: [
          ['', '(none)'],
          ['2000', '2000 (SL2000 — implementation-dependent)'],
          ['3000', '3000 (SL3000 — implementation-dependent)']
        ]
      };

      function log(message) {
        logEl.textContent += message + '\n';
      }

      function setOptions(select, options, defaultValue) {
        select.replaceChildren();

        for (const [value, label] of options) {
          select.add(new Option(label, value));
        }

        select.value = defaultValue;
      }

      function updateRobustnessMenus() {
        const keySystem = keySystemSelect.value;
        const options = robustnessOptions[keySystem];

        // Reset robustness to appropriate defaults when DRM changes.
        setOptions(videoSelect, options, '');
        setOptions(
          audioSelect,
          options,
          keySystem === WIDEVINE ? 'SW_SECURE_CRYPTO' : ''
        );
      }

      function selectValidValue(select, value) {
        if (Array.from(select.options).some(option => option.value === value)) {
          select.value = value;
        }
      }

      function populateFormFromUrl() {
        const params = new URLSearchParams(window.location.search);

        // Restore DRM first so the correct robustness menus exist.
        if (params.has('keySystem')) {
          selectValidValue(keySystemSelect, params.get('keySystem'));
        }

        updateRobustnessMenus();

        if (params.has('manifest')) {
          manifestInput.value = params.get('manifest');
        }

        if (params.has('license')) {
          licenseInput.value = params.get('license');
        }

        if (params.has('videoRobustness')) {
          selectValidValue(videoSelect, params.get('videoRobustness'));
        }

        if (params.has('audioRobustness')) {
          selectValidValue(audioSelect, params.get('audioRobustness'));
        }

        autoloadInput.checked = params.get('autoload') === 'true';
      }

      function createShareUrl() {
        const url = new URL(window.location.href);

        // Include empty values too, so "(none)" overrides default settings.
        url.searchParams.set('manifest', manifestInput.value);
        url.searchParams.set('license', licenseInput.value);
        url.searchParams.set('keySystem', keySystemSelect.value);
        url.searchParams.set('videoRobustness', videoSelect.value);
        url.searchParams.set('audioRobustness', audioSelect.value);
        url.searchParams.set('autoload', String(autoloadInput.checked));

        return url.toString();
      }

      async function share() {
        const url = createShareUrl();

        // Always expose the URL for manual copying.
        shareArea.hidden = false;
        shareInput.value = url;

        try {
          if (!navigator.clipboard?.writeText) {
            throw new Error('Clipboard unavailable');
          }

          await navigator.clipboard.writeText(url);
          log('Share URL copied to clipboard.');
        } catch {
          shareInput.focus();
          shareInput.select();
          log('Copy the URL from the Shareable URL field.');
        }
      }

      async function load() {
        if (loading) return;

        logEl.textContent = '';

        if (!supported) {
          log('Browser not supported or Shaka Player unavailable.');
          return;
        }

        const manifestUrl = manifestInput.value.trim();
        const licenseUrl = licenseInput.value.trim();
        const keySystem = keySystemSelect.value;
        const videoRobustness = videoSelect.value;
        const audioRobustness = audioSelect.value;

        if (!manifestUrl) {
          log('MANIFEST_URL is required.');
          return;
        }

        loading = true;
        loadButton.disabled = true;

        try {
          if (player) {
            await player.destroy();
            player = null;
          }

          player = new shaka.Player(video);

          player.addEventListener('error', event => {
            log('Player error: ' + JSON.stringify(event.detail));
          });

          player.configure({
            drm: {
              servers: licenseUrl ? { [keySystem]: licenseUrl } : {},
              preferredKeySystems: [keySystem],
              advanced: {
                [keySystem]: {
                  videoRobustness,
                  audioRobustness
                }
              }
            }
          });

          log(`Requested key system: ${keySystem}`);
          log(`Video robustness: ${videoRobustness || '(none)'}`);
          log(`Audio robustness: ${audioRobustness || '(none)'}`);

          await player.load(manifestUrl);
          log('Loaded successfully.');

          try {
            await video.play();
            log('Playback started.');
          } catch (error) {
            if (error.name === 'NotAllowedError') {
              log('Autoplay blocked. Use the video controls to start playback.');
            } else {
              log('Playback failed: ' + error.message);
            }
          }
        } catch (error) {
          log(
            'Load failed: ' +
            (error.code ?? error.message) +
            ' ' +
            JSON.stringify(error.data ?? [])
          );
        } finally {
          loading = false;
          loadButton.disabled = false;
        }
      }

      keySystemSelect.addEventListener('change', () => {
        updateRobustnessMenus();

        if (keySystemSelect.value === WIDEVINE) {
          licenseInput.value =
            licenseInput.value.replace('playready', 'widevine');
        } else if (keySystemSelect.value === PLAYREADY) {
          licenseInput.value =
            licenseInput.value.replace('widevine', 'playready');
        }
      });

      loadButton.addEventListener('click', load);
      shareButton.addEventListener('click', share);

      populateFormFromUrl();

      if (window.shaka) {
        shaka.polyfill.installAll();
        supported = shaka.Player.isBrowserSupported();
      }

      if (!supported) {
        log('Browser not supported or Shaka Player unavailable.');
        loadButton.disabled = true;
        return;
      }

      if (autoloadInput.checked) {
        load();
      }
    });
  </script>
</body>
</html>
